    bundle = "web-app"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/web-app
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("web-app.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("web-app.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")

            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache

    def ui_callback(pkg):

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step

    platform.window.config.gui_divider = 1

const LOADING_LINES = [
    "Alex is shuffling the letter tiles...",
    "Alex is hiding today's words...",
    "Sharpening Alex's pencils...",
    "Alex is painting the tiles green...",
    "Teaching the solver Alex's tricks...",
    "Alex is checking the dictionary...",
]

function rotate_loading_line() {

        clearInterval(loading_timer)
        return
    }

    show_infobox()

    <script>
        // Sharing results (gui.py publish_share_targets / poll_share). Browsers only open the share
        // sheet or write to the clipboard during the tap or click itself, and Python sees a tap a frame
        // later, so the game tells this page where its Share buttons are and this click handler shares.
        window.wordleShareTargets = "";  // JSON [[x, y, width, height, text], ...] in canvas pixels
        window.wordleShareStatus = "";   // "shared", "cancelled", "copied" or "shown", for the game to show

        function wordleShowText(text) {
            // Last resort when the browser refuses both the share sheet and the clipboard: show the
            // text in a box with a real Copy button (a tap on a real button always counts).
            var old = document.getElementById("wordle-share-box");
            if (old) old.remove();
            var box = document.createElement("div");
            box.id = "wordle-share-box";
            box.style.cssText = "position:fixed;inset:0;z-index:1000;display:flex;align-items:center;" +
                "justify-content:center;background:rgba(0,0,0,0.6);font:16px -apple-system,Helvetica,sans-serif";
            var panel = document.createElement("div");
            panel.style.cssText = "background:#212636;color:#eceff4;border-radius:16px;padding:18px;width:min(88vw,420px)";
            var title = document.createElement("div");
            title.textContent = "Copy your result";
            title.style.cssText = "font-weight:bold;margin-bottom:10px";
            var area = document.createElement("textarea");
            area.value = text;
            area.readOnly = true;
            area.rows = Math.min(10, text.split("\n").length + 1);
            area.style.cssText = "width:100%;box-sizing:border-box;font:16px monospace;background:#151924;color:#eceff4;" +
                "border:1px solid #323850;border-radius:10px;padding:10px;resize:none;touch-action:auto";
            var row = document.createElement("div");
            row.style.cssText = "display:flex;gap:10px;margin-top:12px";
            function button(label, primary, action) {
                var b = document.createElement("button");
                b.textContent = label;
                b.style.cssText = "flex:1;padding:12px;border:0;border-radius:10px;font:bold 16px -apple-system,Helvetica,sans-serif;" +
                    "color:#eceff4;background:" + (primary ? "#2ea06b" : "#323950");
                b.addEventListener("click", action);
                row.appendChild(b);
                return b;
            }
            var copy = button("Copy", true, function () {
                area.focus();
                area.setSelectionRange(0, text.length);
                var done = function () { copy.textContent = "Copied!"; };
                var ok = false;
                try { ok = document.execCommand("copy"); } catch (e) {}
                if (ok) done();
                else if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () {
                    copy.textContent = "Select the text and copy it";
                });
            });
            button("Done", false, function () { box.remove(); });
            panel.appendChild(title);
            panel.appendChild(area);
            panel.appendChild(row);
            box.appendChild(panel);
            document.body.appendChild(box);
            window.wordleShareStatus = "shown";
        }

        function wordleCopy(text) {
            function fallback() {
                var area = document.createElement("textarea");
                area.value = text;
                area.setAttribute("readonly", "");
                area.style.cssText = "position:fixed;top:0;left:0;opacity:0";
                document.body.appendChild(area);
                area.select();
                var copied = false;
                try { copied = document.execCommand("copy"); } catch (e) {}
                document.body.removeChild(area);
                if (copied) window.wordleShareStatus = "copied";
                else wordleShowText(text);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () { window.wordleShareStatus = "copied"; }, fallback);
            } else {
                fallback();
            }
        }

        // iPhone Safari allows one share at a time, and sometimes never hears back from a finished one
        // (after sending in Messages, say): every later share is then refused until a reload. So if
        // the last share is still unanswered, share from a fresh hidden frame (each page has its own
        // share slot; it's the same site, so it counts as the same tap) and only copy if that fails.
        var wordleSharePending = false;
        function wordleFreshShare() {
            try {
                var frame = document.createElement("iframe");
                frame.setAttribute("aria-hidden", "true");
                frame.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none";
                document.body.appendChild(frame);
                var nav = frame.contentWindow && frame.contentWindow.navigator;
                if (!nav || !nav.share) { frame.remove(); return null; }
                return { share: function (data) { return nav.share(data); }, done: function () {
                    setTimeout(function () { frame.remove(); }, 1000); } };
            } catch (e) { return null; }
        }
        function wordleShareText(text) {
            // Phones get the share sheet (Messages, WhatsApp...); computers copy to the clipboard.
            var phone = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
            if (!(phone && navigator.share)) { wordleCopy(text); return; }
            var via = wordleSharePending ? wordleFreshShare() : null;
            var attempt;
            try {
                attempt = via ? via.share({ text: text }) : navigator.share({ text: text });
            } catch (e) {
                attempt = Promise.reject(e);
            }
            if (!via) wordleSharePending = true;
            attempt.then(function () {
                window.wordleShareStatus = "shared";
            }, function (error) {
                if (error && error.name === "AbortError") window.wordleShareStatus = "cancelled";
                else wordleCopy(text);
            }).then(function () {
                if (via) via.done(); else wordleSharePending = false;
            });
        }

        function wordleShareAt(clientX, clientY) {
            // The text of the Share button at this point on the page, or null.
            var targets;
            try { targets = JSON.parse(window.wordleShareTargets || "[]"); } catch (e) { return null; }
            var canvas = document.getElementById("canvas");
            if (!targets.length || !canvas) return null;
            var box = canvas.getBoundingClientRect();
            var x = (clientX - box.left) * canvas.width / box.width;
            var y = (clientY - box.top) * canvas.height / box.height;
            for (var i = 0; i < targets.length; i++) {
                var t = targets[i];
                if (x >= t[0] && x < t[0] + t[2] && y >= t[1] && y < t[1] + t[3]) return t[4];
            }
            return null;
        }

        // Phones: act on the finger lifting. iPhone Safari sends no "click" for taps on a plain
        // element like the game's canvas, so a click listener alone never fires there. The touch must
        // start and end on the same button (a drag that ends on it doesn't count).
        var wordleTouchStart = null, wordleTouchHandled = 0;
        window.wordleTouchCount = 0;  // every touch the page sees (the ?debug=1 readout compares it with the game's)
        document.addEventListener("touchstart", function () { window.wordleTouchCount++; }, { capture: true, passive: true });
        document.addEventListener("touchstart", function (event) {
            var touch = event.touches && event.touches[0];
            wordleTouchStart = touch ? wordleShareAt(touch.clientX, touch.clientY) : null;
        }, { capture: true, passive: true });
        document.addEventListener("touchend", function (event) {
            var touch = event.changedTouches && event.changedTouches[0];
            var text = touch ? wordleShareAt(touch.clientX, touch.clientY) : null;
            if (text !== null && text === wordleTouchStart) {
                wordleTouchHandled = Date.now();
                wordleShareText(text);
            }
            wordleTouchStart = null;
        }, { capture: true, passive: true });
        // Mouse and trackpad.
        document.addEventListener("click", function (event) {
            if (Date.now() - wordleTouchHandled < 1000) return;  // the same tap, already shared
            var text = wordleShareAt(event.clientX, event.clientY);
            if (text !== null) wordleShareText(text);
        }, true);

        // Back in view (switched back to the tab or the home-screen app) or back online: the game
        // syncs straight away (gui.py poll_woke), so games played on another device show up.
        window.wordleWoke = false;
        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") window.wordleWoke = true;
        });
        window.addEventListener("pageshow", function () { window.wordleWoke = true; });
        window.addEventListener("online", function () { window.wordleWoke = true; });

        // Sync (sync.py BrowserTransport): the browser's Python has no sockets or threads, so the page
        // makes the request and keeps the answer, as JSON {status, text}, until the game takes it.
        // status 0 means it never got there (offline, or no answer within 15 seconds).
        window.wordleFetchResults = {};

        function wordleFetch(id, url, headers, body, method) {
            var stop = window.AbortController ? new AbortController() : null;
            var timer = setTimeout(function () { if (stop) stop.abort(); }, 15000);
            var verb = method || "POST";
            fetch(url, { method: verb, headers: JSON.parse(headers), body: verb === "GET" ? undefined : body, cache: "no-store",
                         credentials: "omit", signal: stop ? stop.signal : undefined })
                .then(function (r) { return r.text().then(function (t) { return { status: r.status, text: t }; }); })
                .catch(function () { return { status: 0, text: "" }; })
                .then(function (answer) {
                    clearTimeout(timer);
                    window.wordleFetchResults[id] = JSON.stringify(answer);
                });
        }

        function wordleFetchTake(id) {
            var answer = window.wordleFetchResults[id];
            if (answer === undefined) return "";
            delete window.wordleFetchResults[id];
            return answer;
        }

        // Sign-in form (sync.py auth_form, drawn by gui.py publish_auth_form). A real HTML <form> over the
        // canvas, so Safari can fill in the email, a saved password (and offer a strong new one), and the
        // 6-digit code from Mail. The game shows it with wordleAuthShow(JSON spec) and reads what the
        // player did with wordleAuthTake() (JSON {action, email, password, code}, or "").
        window.wordleAuthEvent = "";
        var wordleAuth = null;  // {box, mode, fields...} while the form is up

        function wordleAuthTake() {
            var e = window.wordleAuthEvent;
            window.wordleAuthEvent = "";
            return e || "";
        }

        function wordleAuthHide() {
            if (wordleAuth) wordleAuth.box.remove();
            wordleAuth = null;
        }

        function wordleAuthShow(specText) {
            var spec = JSON.parse(specText);
            if (!wordleAuth || wordleAuth.mode !== spec.mode || wordleAuth.purpose !== spec.purpose) wordleAuthBuild(spec);
            var a = wordleAuth;
            a.error.textContent = spec.error || "";
            a.note.textContent = spec.note || "";
            a.submit.disabled = !!spec.busy;
            a.submit.textContent = spec.busy ? "One moment..." : a.label;
            if (a.email && spec.email && !a.email.value) a.email.value = spec.email;
        }

        function wordleAuthBuild(spec) {
            wordleAuthHide();
            if (!wordleAuth) window.wordleAuthEvent = "";  // (nothing left over from an earlier form)
            var mode = spec.mode, reset = spec.purpose === "reset";
            var titles = {signin: "Sign in to save your stats", signup: "Create an account",
                          code: reset ? "Reset your password" : "Email me a code", verify: "Enter the code",
                          newpassword: "Choose a new password", delete: "Delete your account"};
            var intros = {signin: "Your games stay safe in your account, so a new phone or a cleared browser gets " +
                              "them back. Playing without an account still works.",
                          signup: "Use an email you can open on this phone: we'll send a 6-digit code to confirm it.",
                          code: reset ? "We'll email you a 6-digit code. Then you can choose a new password." :
                              "No password needed: we'll email you a 6-digit code. (This makes an account if you " +
                              "don't have one.)",
                          verify: "", newpassword: "Pick a new password for " + (spec.email || "your account") + ".",
                          delete: "This permanently deletes your account, its email and password, your friends and " +
                              "every game in it, on all your devices. It can't be undone."};
            var labels = {signin: "Sign in", signup: "Create account", code: "Email me a code", verify: "Continue",
                          newpassword: "Save password", delete: "Delete my account"};
            var actions = {signin: "signin", signup: "signup", code: "send_code", verify: "verify",
                           newpassword: "set_password", delete: "confirm_delete"};
            var box = document.createElement("div");
            box.id = "wordle-auth";
            box.style.cssText = "position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;" +
                "background:rgba(0,0,0,0.6);font:16px -apple-system,Helvetica,sans-serif;touch-action:auto;overflow:auto";
            // Keep typing in the form away from the game (which listens to the whole page).
            ["keydown", "keyup", "keypress"].forEach(function (type) {
                box.addEventListener(type, function (e) { e.stopPropagation(); });
            });
            ["touchstart", "touchend", "click"].forEach(function (type) {
                box.addEventListener(type, function (e) { e.stopPropagation(); });
            });
            var form = document.createElement("form");
            form.autocomplete = "on";
            form.style.cssText = "background:#212636;color:#eceff4;border-radius:16px;padding:20px;width:min(88vw,420px);" +
                "box-sizing:border-box;margin:16px";
            function text(content, css) {
                var d = document.createElement("div");
                d.textContent = content;
                d.style.cssText = css;
                form.appendChild(d);
                return d;
            }
            function input(type, name, autocomplete, placeholder, extra) {
                var i = document.createElement("input");
                i.type = type; i.name = name; i.autocomplete = autocomplete; i.placeholder = placeholder;
                i.style.cssText = "display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:12px;font:16px " +
                    "-apple-system,Helvetica,sans-serif;background:#151924;color:#eceff4;border:1px solid #323850;" +
                    "border-radius:10px;touch-action:auto";
                for (var k in (extra || {})) i.setAttribute(k, extra[k]);
                form.appendChild(i);
                return i;
            }
            function link(label, action) {
                var b = document.createElement("button");
                b.type = "button";
                b.textContent = label;
                b.style.cssText = "display:block;width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;" +
                    "font:15px -apple-system,Helvetica,sans-serif;color:#eceff4;background:#323950";
                b.addEventListener("click", function () { post(action); });
                form.appendChild(b);
            }
            text(titles[mode], "font-weight:bold;font-size:19px;margin-bottom:6px");
            if (intros[mode]) text(intros[mode], "color:#a7aec4;font-size:14px;margin-bottom:6px");
            var a = {box: box, mode: mode, purpose: spec.purpose, label: labels[mode]};
            if (mode === "verify" || mode === "newpassword" || mode === "delete") {
                // The account's email as the username, so the password manager files the code/password under it.
                a.email = input("email", "email", "username", "Email", {readonly: "readonly"});
                a.email.value = spec.email || "";
                a.email.style.opacity = "0.7";
            } else {
                a.email = input("email", "email", "username", "Email", {autocapitalize: "off", spellcheck: "false",
                                                                      required: "required"});
                a.email.value = spec.email || "";
            }
            if (mode === "signin") a.password = input("password", "password", "current-password", "Password");
            if (mode === "signup" || mode === "newpassword") {
                a.password = input("password", "password", "new-password", "New password (6 or more characters)",
                                   {minlength: "6"});
            }
            if (mode === "verify" || mode === "delete") {
                a.code = input("text", "code", "one-time-code", "6-digit code",
                               {inputmode: "numeric", pattern: "[0-9]*", maxlength: "8"});
            }
            a.error = text("", "color:#ee9664;font-size:14px;margin:6px 0;min-height:0");
            a.note = text("", "color:#60c891;font-size:14px;margin:6px 0;min-height:0");
            a.submit = document.createElement("button");
            a.submit.type = "submit";
            a.submit.textContent = a.label;
            a.submit.style.cssText = "display:block;width:100%;margin-top:8px;padding:13px;border:0;border-radius:10px;" +
                "font:bold 17px -apple-system,Helvetica,sans-serif;color:#fff;background:" +
                (mode === "delete" ? "#c2412d" : "#2ea06b");
            form.appendChild(a.submit);
            if (mode === "signin") {
                link("Email me a code instead", "mode:code");
                link("Forgot password?", "mode:reset");
                link("Create an account", "mode:signup");
            } else if (mode === "signup") {
                link("I already have an account", "mode:signin");
            } else if (mode === "code") {
                link("Use my password instead", "mode:signin");
            } else if (mode === "delete") {
                link("Send a new code", "resend_delete");
            } else if (mode === "verify") {
                link("Send a new code", "resend");
                if (spec.purpose === "signup") link("Used the link in the email? Sign in", "mode:signin");
                link("Use a different email", spec.purpose === "signup" ? "mode:signup" : "mode:code");
            }
            link("Cancel", "cancel");
            function post(action) {
                window.wordleAuthEvent = JSON.stringify({action: action, email: a.email ? a.email.value : "",
                    password: a.password ? a.password.value : "", code: a.code ? a.code.value : ""});
            }
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                post(actions[mode]);
            });
            // Enter in any field submits, without relying on the browser's own "implicit submission"
            // (which Safari can skip, e.g. right after it fills in a saved password).
            form.addEventListener("keydown", function (e) {
                if (e.key !== "Enter" || e.isComposing || e.target.tagName !== "INPUT") return;
                e.preventDefault();
                if (!a.submit.disabled) post(actions[mode]);
            });
            box.appendChild(form);
            document.body.appendChild(box);
            wordleAuth = a;
            setTimeout(function () {
                var first = mode === "verify" || mode === "delete" ? a.code : (a.email && !a.email.value ? a.email : a.password || a.email);
                if (first) first.focus();
            }, 50);
        }

        // "today at 3:42 PM" for a saved time (sync.py last_saved), in the phone's own time zone.
        function wordleWhen(iso) {
            var t = new Date(iso), now = new Date();
            if (isNaN(t)) return "";
            var hour = t.toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: "2-digit"});
            var day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var then = new Date(t.getFullYear(), t.getMonth(), t.getDate());
            var days = Math.round((day - then) / 86400000);
            var label = days === 0 ? "today" : days === 1 ? "yesterday" :
                t.toLocaleDateString([], {month: "short", day: "numeric"});
            return label + " at " + hour;
        }

        // The player's local date for the daily puzzle (gui.local_date), from the phone's own clock.
        function wordleToday() {
            var d = new Date();
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }
    </script>

    <script>
        // Offline cache (web/sw.js): repeat visits load from the phone and work without internet.
        // It isn't in local test builds (the register just fails there).
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function () {
                // This visit downloaded the Python runtime before the worker existed; tell it what to save.
                function share() {
                    navigator.serviceWorker.ready.then(function (reg) {
                        reg.active.postMessage({ cache: performance.getEntriesByType("resource").map(function (e) { return e.name; }) });
                    });
                }
                setTimeout(share, 15000);
                setTimeout(share, 60000);
            }).catch(function (e) { console.log("No offline cache:", e); });
        }
    </script>
